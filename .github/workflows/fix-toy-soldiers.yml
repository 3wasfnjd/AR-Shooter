name: Fix Toy Soldiers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-toy-soldiers.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime
        run: python3 tools/fix_toy_soldiers.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/elite-procedural.js
          test -s assets/characters/humans/swat_elite_quest.glb
          grep -q "TOY_SOLDIER_HEIGHT = 0.42" src/main.js
          grep -q "updateEliteMotion" src/main.js
          grep -q "position.y = enemy.floorY" src/main.js
      - name: Publish
        run: |
          rm -f .github/workflows/fix-toy-soldiers.yml tools/fix_toy_soldiers.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Shrink soldiers to toy scale and fix Elite motion and grounding'
          git push origin HEAD:main
