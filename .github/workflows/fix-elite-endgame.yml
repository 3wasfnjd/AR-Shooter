name: Guard Elite Endgame

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-elite-endgame.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: |
          python3 -c "from pathlib import Path; p=Path('src/main.js'); s=p.read_text(); old='  for (const enemy of enemies) enemy.mixer.timeScale = 0.2;'; new='  for (const enemy of enemies) { if (enemy.mixer) enemy.mixer.timeScale = 0.2; }'; assert old in s; p.write_text(s.replace(old,new))"
          node --check src/main.js
          node --check src/elite-procedural.js
      - name: Publish
        run: |
          rm -f .github/workflows/fix-elite-endgame.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Guard procedural Elite enemy on game over'
          git push origin HEAD:main
