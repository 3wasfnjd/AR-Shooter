name: Fix Elite Performance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-elite-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime
        run: python3 tools/fix-elite-performance.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/elite-procedural.js
          grep -q "ELITE_TOY_HEIGHT = 0.38" src/main.js
          grep -q "MAX_ACTIVE_ENEMIES = 4" src/main.js
          grep -q "enemy.hitMeshes" src/main.js
          grep -q "activeAudioCount" src/main.js
      - name: Publish
        run: |
          rm -f .github/workflows/fix-elite-performance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Elite visibility and stabilize Quest runtime'
          git push origin HEAD:main
