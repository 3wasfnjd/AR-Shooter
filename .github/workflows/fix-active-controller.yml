name: Fix Active Controller Reference

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-active-controller.yml']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix runtime controller reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('controller.getWorldPosition(origin);','activeController.getWorldPosition(origin);')
          s=s.replace('controller.getWorldQuaternion(tmpQuat);','activeController.getWorldQuaternion(tmpQuat);')
          if 'controller.getWorldPosition(origin);' in s or 'controller.getWorldQuaternion(tmpQuat);' in s:
              raise SystemExit('old controller reference remains')
          p.write_text(s,encoding='utf-8')
          PY
          node --check src/main.js
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-active-controller.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix active controller shooting reference'
          git push origin HEAD:main
