name: Add Elite SWAT Enemy

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-elite-enemy.yml']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Elite SWAT
        run: python3 scripts/add_elite_enemy.py
      - name: Validate JavaScript and assets
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/elite-rig.js
          test -s assets/characters/humans/swat_elite_quest.glb
          python3 -m json.tool assets/config/assets.json >/dev/null
      - name: Publish
        shell: bash
        run: |
          rm -f .github/workflows/add-elite-enemy.yml
          rm -f scripts/add_elite_enemy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Elite SWAT with retargeted human combat motion'
          git push origin HEAD:main
