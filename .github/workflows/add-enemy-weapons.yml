name: Add Enemy Weapons

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-enemy-weapons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime
        run: python3 .github/scripts/add_enemy_weapons.py
      - name: Validate
        run: |
          node --check src/main.js
          node --check src/elite-procedural.js
          test -s assets/weapons/west/Rifle_Assault_West.glb
          grep -q "attachEnemyWeapon" src/main.js
          grep -q "normalizeWeapon(enemyWeaponTemplate, 0.18)" src/main.js
      - name: Publish
        run: |
          rm -f .github/workflows/add-enemy-weapons.yml
          rm -f .github/scripts/add_enemy_weapons.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Give all toy soldiers visible rifles'
          git push origin HEAD:main
