name: Patch Mini Human Reactions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-mini-human-reactions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch_mini_humans.py

      - name: Validate JavaScript
        run: node --check src/main.js

      - name: Publish
        run: |
          rm -f .github/workflows/patch-mini-human-reactions.yml
          rm -f .github/scripts/patch_mini_humans.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make enemies mini humans with softer hit reactions'
          git push origin HEAD:main
