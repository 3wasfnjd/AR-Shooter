name: Patch Mini Human Reactions

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-mini-human-reactions.yml']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mini-human and reaction changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()

          s=s.replace('normalizeCharacter(enemyTemplate, 1.72);', 'normalizeCharacter(enemyTemplate, 1.20);')

          old="""function hitEnemy(enemy, point) {
  if (!enemy || enemy.dead) return;
  const profile = weaponProfiles[state.weaponIndex];
  enemy.hp -= profile.damage;
"""
          new="""function hitEnemy(enemy, point, shotDirection = null) {
  if (!enemy || enemy.dead) return;
  const profile = weaponProfiles[state.weaponIndex];
  enemy.hp -= profile.damage;

  // A small directional body reaction prevents hits from feeling robotic.
  if (shotDirection) {
    const worldQuat = enemy.root.getWorldQuaternion(new THREE.Quaternion());
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(worldQuat);
    const side = Math.sign(right.dot(shotDirection)) || (Math.random() > 0.5 ? 1 : -1);
    enemy.hitTilt = side * (0.10 + Math.random() * 0.08);
    enemy.root.position.addScaledVector(shotDirection, 0.025 + Math.random() * 0.02);
  }
"""
          if old not in s: raise SystemExit('hitEnemy signature block not found')
          s=s.replace(old,new)

          old="if (hits.length) hitEnemy(hits[0].object.userData.enemyRef, hits[0].point);"
          new="if (hits.length) hitEnemy(hits[0].object.userData.enemyRef, hits[0].point, direction);"
          if old not in s: raise SystemExit('shoot hit call not found')
          s=s.replace(old,new)

          old="""    root, model, mixer, action: null, animName: '', hp: 100, dead: false,
    speed: 0.62 + Math.min(state.wave, 6) * 0.035 + Math.random() * 0.12,
"""
          new="""    root, model, mixer, action: null, animName: '', hp: 100, dead: false,
    hitTilt: 0,
    speed: 0.62 + Math.min(state.wave, 6) * 0.035 + Math.random() * 0.12,
"""
          if old not in s: raise SystemExit('enemy object block not found')
          s=s.replace(old,new)

          old="""    action.reset().setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.fadeIn(0.06).play();
    enemy.action = action;
  }
  setTimeout(() => {
    scene.remove(enemy.root);
    const idx = enemies.indexOf(enemy);
    if (idx >= 0) enemies.splice(idx, 1);
    startNextWaveIfReady();
  }, 1900);
"""
          new="""    action.reset().setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.timeScale = 0.88 + Math.random() * 0.18;
    action.fadeIn(0.06).play();
    enemy.action = action;
  }

  // Slightly different final lean for each casualty, then leave the body in place.
  enemy.hitTilt += (Math.random() > 0.5 ? 1 : -1) * (0.05 + Math.random() * 0.08);
  setTimeout(() => {
    scene.remove(enemy.root);
    const idx = enemies.indexOf(enemy);
    if (idx >= 0) enemies.splice(idx, 1);
    startNextWaveIfReady();
  }, 7800 + Math.random() * 2200);
"""
          if old not in s: raise SystemExit('death block not found')
          s=s.replace(old,new)

          old="""    const pos = enemy.root.position;
    tmpVec2.set(player.x - pos.x, 0, player.z - pos.z);
"""
          new="""    const pos = enemy.root.position;
    enemy.root.rotation.z = THREE.MathUtils.damp(enemy.root.rotation.z, enemy.hitTilt || 0, 12, delta);
    enemy.hitTilt = THREE.MathUtils.damp(enemy.hitTilt || 0, 0, enemy.dead ? 1.1 : 7.5, delta);
    tmpVec2.set(player.x - pos.x, 0, player.z - pos.z);
"""
          if old not in s: raise SystemExit('enemy update block not found')
          s=s.replace(old,new)

          p.write_text(s)
          PY

      - name: Validate JavaScript
        run: node --check src/main.js

      - name: Publish patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-mini-human-reactions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make enemies mini humans with softer hit reactions'
          git push origin HEAD:main
